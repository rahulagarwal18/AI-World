name: Render Keep-Alive 24/7 Heartbeat

on:
  schedule:
    # Runs every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Services to Prevent Spin-Down
        run: |
          curl -s https://autowork-world-ai.onrender.com/api || true
          curl -s https://ai-world-rudu.onrender.com/api || true
          echo "Render Keep-Alive ping executed successfully!"
